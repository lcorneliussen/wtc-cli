name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate committed release notes
        id: notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || { echo "Expected a vMAJOR.MINOR.PATCH semantic version tag"; exit 1; }
          notes="internal/wtc/release-notes/$version.md"
          test -s "$notes" || { echo "Commit $notes before tagging"; exit 1; }
          test "$(head -n 1 "$notes")" = "# wtc $version" || { echo "Release notes heading does not match tag"; exit 1; }
          go test ./internal/wtc -run '^TestEmbeddedReleaseNotes$'
          echo "path=$notes" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --release-notes=${{ steps.notes.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
