name: Visual evidence
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native-status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned terminal decoder
        run: python -m pip install pyte==0.8.2 wcwidth==0.9.4
      - name: Check capture assertions and escaping
        run: python -B -m unittest discover -s tools/visual-evidence -p 'test_*.py'
      - name: Capture and check native synthetic status
        run: python -B tools/visual-evidence/capture.py --out "$RUNNER_TEMP/visual-evidence" --chrome "$(command -v google-chrome)" --require-png
      - name: Retain captures and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-status-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/visual-evidence
          if-no-files-found: warn
          retention-days: 14
