version: 2
project_name: taba
# One program under two names: `taba`, and `wtc` for scripts, mise pins and
# older `wtc upgrade` runs that still call it. The binary picks its display
# name from argv[0] (internal/branding).
builds:
  - &build
    id: taba
    main: ./cmd/taba
    binary: taba
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
  - <<: *build
    id: wtc
    binary: wtc
archives:
  - id: taba
    ids: [taba, wtc]
    formats: [tar.gz]
    name_template: 'taba_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
checksum:
  name_template: checksums.txt
# `brew install lcorneliussen/taba/taba` installs both names. The release
# workflow pushes the formula to the tap over SSH with a write deploy key.
brews:
  - name: taba
    ids: [taba]
    repository:
      owner: lcorneliussen
      name: homebrew-taba
      git:
        url: git@github.com:lcorneliussen/homebrew-taba.git
        private_key: "{{ .Env.HOMEBREW_TAP_SSH_PRIVATE_KEY }}"
    directory: Formula
    # A prerelease tag must not replace the stable formula.
    skip_upload: auto
    homepage: https://taba.sh
    description: "Worktree collections for working across repositories, with agents or your editor (formerly wtc)"
    license: MIT
    install: |
      bin.install "taba"
      bin.install "wtc"
    test: |
      assert_match version.to_s, shell_output("#{bin}/taba --version")
      assert_match version.to_s, shell_output("#{bin}/wtc --version")
